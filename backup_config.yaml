# Completed snapshots to keep for each source. Unchanged files are hard-linked
# between snapshots, so each extra snapshot only costs the space of what changed.
keep: 30

sources:

  - name: share1                 # folder name on the backup drive
    path: /mnt/network_share1    # must be a mount point unless require_mount: false
    exclude:                     # rsync exclude patterns
      - "*.tmp"
      - ".cache"

  - name: share2
    path: /mnt/network_share2
    exclude:
      - "*.tmp"
      - ".cache"
